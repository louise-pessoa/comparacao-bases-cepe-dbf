# Configuração do projeto. O código fica em src/dbf_cepe. As dependências fixadas ficam em
# requirements.txt (lido também pelo Dependabot e pelo CI) e entram aqui por referência.
# Rodar sem instalar: python main.py ...  Instalado (pip install -e .): dbf-cepe ...

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comparacao-bases-cepe-dbf"
version = "0.1.0"
description = "Identifica atos do Diário Oficial de Pernambuco (CEPE) e confere com a base da DBF/SEFAZ-PE"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
dbf-cepe = "dbf_cepe.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbf_cepe = ["recursos/fontes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "ferramentas"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Só erros reais (pyflakes e sintaxe): importação sem uso, nome indefinido etc.
select = ["F", "E9"]
